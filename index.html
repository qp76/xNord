<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Nord87q — personal profile and links.">
  <meta property="og:title" content="Nord87q — Profile">
  <meta property="og:description" content="Developer, creator & internet enjoyer.">
  <meta property="og:type" content="website">
  <title>Nord87q — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="video-stage" aria-hidden="true">
    <div id="videoTrack" class="video-track"></div>
    <div class="video-overlay"></div>
    <div class="video-vignette"></div>
    <div class="noise"></div>
  </div>

  <div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="welcome-blur"></div>
    <div class="welcome-shade"></div>
    <div class="welcome-orb orb-one"></div><div class="welcome-orb orb-two"></div>
    <div class="welcome-card">
      <div class="mini-status"><span></span><b>ONLINE</b><i></i><em id="welcomeLocation">ALGERIA</em></div>
      <div class="welcome-avatar"><img id="welcomeAvatar" alt="" hidden><span id="welcomeInitial">N</span></div>
      <h1 id="welcomeTitle">Welcome to <strong>Nord87q</strong></h1>
      <p id="welcomeDescription">Click enter to visit my profile.</p>
      <button class="enter-btn" id="enterBtn" type="button">Enter <span><i class="fa-solid fa-arrow-right"></i></span></button>
      <small>Click to continue · sound starts after entering</small>
    </div>
  </div>

  <header class="topbar">
    <div class="location-pill"><span class="live-dot"></span><strong id="locationText">Algeria</strong><i></i><span id="timezoneText">UTC+1</span></div>
    <div class="top-actions">
      <button class="round-btn" id="videoSoundBtn" type="button" aria-label="Unmute video sound" aria-pressed="false"><i class="fa-solid fa-volume-xmark"></i></button>
    </div>
  </header>

  <main class="page">
    <section class="profile-card">
      <div class="profile-head">
        <div class="avatar-wrap">
          <div class="avatar-ring"></div>
          <div class="avatar" id="avatar"><span id="avatarInitial">N</span><img id="avatarImage" alt="" hidden></div>
          <span class="online-badge" title="Online"></span>
        </div>
        <div class="eyebrow"><span></span><b id="eyebrowText">DIGITAL PROFILE</b></div>
        <h2 id="profileName">Nord<span>87q</span></h2>
        <div class="badges" id="badges"></div>
        <p class="bio" id="bio"></p>
      </div>

      <div class="clock-card">
        <div class="clock-copy"><small>LOCAL TIME · <span id="clockZone">ALGERIA</span></small><strong id="clock">--:--:--</strong></div>
        <div class="clock-date" id="date">--</div>
      </div>

      <nav class="links" id="links" aria-label="Social links"></nav>

      <div class="profile-hint"><i class="fa-solid fa-volume-low"></i><span>Tap the sound button to hear the background video</span></div>
    </section>
  </main>

  <footer><span>© <span id="year"></span> <b id="footerName">Nord87q</b></span><i></i><span id="footerText">Made in Algeria</span></footer>

  <div class="cursor" id="cursor"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
